<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videoaulas — Math For Teens</title>
<meta name="description" content="Videoaulas de Matemática do Math For Teens. Assiste as aulas no YouTube e descarrega os PDFs.">
<meta name="author" content="Makyneta Unipessoal, Lda.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="assets/css/reset.css">
<link rel="stylesheet" href="assets/css/styles.css">
<script defer src="assets/js/chatbot.js"></script>
<script defer src="assets/js/components.js"></script>
<script defer src="assets/js/main.js"></script>
<style>
/* ── Smaller Hero (scoped override) ───────── */
.vid-hero {
  padding: calc(var(--header-h) + 56px) var(--space-lg) 64px;
}
.vid-hero-glow-1,
.vid-hero-glow-2 {
  opacity: 0.35;
}
.vid-hero-symbols span {
  font-size: 1.3rem !important;
  opacity: 0.2;
}
.vid-hero-badge {
  margin-bottom: var(--space-md);
  padding: 6px 16px;
  font-size: 0.75rem;
}
.vid-hero h1 {
  font-size: clamp(1.5rem, 3.5vw, 2.2rem);
  margin-bottom: 0;
}
.vid-hero p {
  display: none;
}
.vid-hero-stats {
  gap: var(--space-xl);
  margin-top: var(--space-sm);
}
.vid-hero-stat-icon {
  display: none;
}
.vid-hero-stat-value {
  font-size: 1.1rem;
}
.vid-hero-stat-label {
  font-size: 0.65rem;
}
.vid-hero-stat + .vid-hero-stat::before {
  display: none;
}
.vid-hero-shape {
  height: 32px;
}

/* ── Loading / Error ──────────────────────── */
.va-loading {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 80px 0;
}
.va-loading-spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--c-border);
  border-top-color: var(--c-primary);
  border-radius: 50%;
  animation: va-spin 0.8s linear infinite;
}
@keyframes va-spin { to { transform: rotate(360deg); } }
.va-error {
  text-align: center;
  padding: 60px 24px;
  color: var(--c-text-3);
}

/* ── Breadcrumb ───────────────────────────── */
.va-breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 28px;
  font-size: 0.88rem;
}
.va-bc-link {
  color: var(--c-text-3);
  text-decoration: none;
  transition: color 0.2s;
}
.va-bc-link:hover { color: var(--c-primary); }
.va-bc-sep { color: var(--c-text-3); }
.va-bc-current { color: var(--c-text); font-weight: 600; }

/* ── Section Header ───────────────────────── */
.va-section-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--c-border-light);
}
.va-section-head h2 {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--c-text);
  flex: 1;
}
.va-section-count {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--c-text-3);
  background: var(--c-bg);
  padding: 4px 12px;
  border-radius: 99px;
}

/* ── Folder Grid ──────────────────────────── */
.va-folder-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.va-folder {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 22px 26px;
  background: var(--c-white);
  border: 1px solid var(--c-border);
  border-radius: 14px;
  cursor: pointer;
  transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
  text-align: left;
  color: inherit;
  font: inherit;
  width: 100%;
}
.va-folder:hover {
  border-color: var(--c-primary);
  box-shadow: 0 4px 20px rgba(14,140,143,0.1);
  transform: translateY(-2px);
}
.va-folder-icon {
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--c-bg, #f8f6f3);
  border-radius: 12px;
  flex-shrink: 0;
}
.va-folder-grade {
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid;
  border-radius: 12px;
  font-weight: 800;
  font-size: 1rem;
  flex-shrink: 0;
  background: var(--c-white);
}
.va-folder-body { flex: 1; min-width: 0; }
.va-folder-title {
  font-size: 1.05rem;
  font-weight: 700;
  margin-bottom: 3px;
}
.va-folder-meta {
  font-size: 0.82rem;
  color: var(--c-text-3);
}
.va-folder-arrow {
  color: var(--c-text-3);
  flex-shrink: 0;
  transition: transform 0.2s, color 0.2s;
}
.va-folder:hover .va-folder-arrow {
  transform: translateX(4px);
  color: var(--c-primary);
}

/* ── Empty State ──────────────────────────── */
.va-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 80px 24px;
  text-align: center;
}
.va-empty-icon { color: var(--c-text-3); opacity: 0.4; }
.va-empty h3 {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--c-text);
}
.va-empty p {
  font-size: 0.9rem;
  color: var(--c-text-3);
  max-width: 340px;
}

/* ════════════════════════════════════════════
   VIDEO GRID — uniform cards
   ════════════════════════════════════════════ */
.va-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.va-card {
  display: flex;
  flex-direction: column;
  background: var(--c-white);
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid var(--c-border-light);
  transition: transform 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out);
}
.va-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 16px 48px rgba(0,0,0,0.08);
}

/* Thumbnail */
.va-card-thumb {
  position: relative;
  aspect-ratio: 16/9;
  display: block;
  overflow: hidden;
  background: var(--c-secondary);
}
.va-card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s var(--ease-out);
}
.va-card:hover .va-card-thumb img {
  transform: scale(1.06);
}
.va-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.35) 100%);
  pointer-events: none;
}

/* Play button on card */
.va-card-play {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
.va-card:hover .va-card-play { opacity: 1; }
.va-play-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(14,140,143,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(14,140,143,0.4);
  transition: transform 0.35s var(--ease-out);
  padding-left: 2px;
}
.va-card:hover .va-play-btn {
  transform: scale(1.12);
}

/* Topic tag on thumbnail */
.va-card-topic {
  position: absolute;
  bottom: 10px;
  left: 10px;
  padding: 3px 10px;
  border-radius: 99px;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(4px);
  color: #fff;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.02em;
}

/* Card body */
.va-card-body {
  display: flex;
  flex-direction: column;
  flex: 1;
  padding: 18px 20px 20px;
}
.va-card-title {
  font-family: var(--font-display);
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--c-secondary);
  line-height: 1.35;
  margin-bottom: 6px;
  transition: color 0.3s;
}
.va-card:hover .va-card-title { color: var(--c-primary); }
.va-card-desc {
  font-size: 0.82rem;
  color: var(--c-text-3);
  line-height: 1.55;
  margin-bottom: 14px;
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Card actions */
.va-card-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--c-border-light);
}
.va-action-yt,
.va-action-pdf {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: 99px;
  font-size: 0.75rem;
  font-weight: 600;
  text-decoration: none;
  transition: background 0.2s;
}
.va-action-yt {
  background: rgba(14,140,143,0.08);
  color: var(--c-primary);
}
.va-action-yt:hover { background: rgba(14,140,143,0.18); }
.va-action-pdf {
  background: rgba(249,232,122,0.08);
  color: var(--c-accent);
}
.va-action-pdf:hover { background: rgba(249,232,122,0.18); }
.va-action-sep {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--c-border);
}

/* ── Responsive ───────────────────────────── */
@media (max-width: 900px) {
  .va-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
  .va-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
  .va-grid { grid-template-columns: 1fr; }
  .va-folder { padding: 16px 18px; gap: 14px; }
  .va-folder-icon, .va-folder-grade { width: 44px; height: 44px; }
}
</style>
</head>
<body>

<div id="header"></div>

<main>
  <section class="vid-hero">
    <div class="vid-hero-glow vid-hero-glow-1"></div>
    <div class="vid-hero-glow vid-hero-glow-2"></div>

      <span>∑</span><span>∫</span><span>π</span><span>√</span><span>∞</span><span>Δ</span>

    <div class="vid-hero-content">

  <section class="section">

        </div>
        <h3>Em breve!</h3>
        <p>Estamos a preparar aulas para esta disciplina. Fica atento!</p>

</main>

<button id="chatbotToggle" class="chatbot-toggle" aria-label="Chat">

</button>

<div id="footer"></div>

<script src="assets/js/supabase-config.js"></script>
<script>
(function() {
  var $loading = document.getElementById('vaLoading');
  var $error   = document.getElementById('vaError');
  var $folders = document.getElementById('vaFolders');
  var $bc      = document.getElementById('vaBreadcrumb');
  var $head    = document.getElementById('vaSectionHead');
  var $headT   = document.getElementById('vaSectionTitle');
  var $headC   = document.getElementById('vaSectionCount');
  var $grid    = document.getElementById('vaGrid');
  var $empty   = document.getElementById('vaEmpty');

  if (!window.supabase) {
    $loading.style.display = 'none';
    $error.style.display = 'block';
    $error.textContent = 'Erro ao carregar. Verifica a tua ligação à internet.';
    return;
  }
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var subjectsData = [];
  var gradesData = [];

  var SUBJECT_ICONS = [
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="12" y1="8" x2="12" y2="16"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8" y2="10.01"/><line x1="12" y1="10" x2="12" y2="10.01"/><line x1="16" y1="10" x2="16" y2="10.01"/><line x1="8" y1="14" x2="8" y2="14.01"/><line x1="12" y1="14" x2="12" y2="14.01"/><line x1="16" y1="14" x2="16" y2="14.01"/><line x1="8" y1="18" x2="8" y2="18.01"/><line x1="12" y1="18" x2="12" y2="18.01"/><line x1="16" y1="18" x2="16" y2="18.01"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 1 0 0-8c-2 0-4 1.33-6 4Z"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4h10"/><path d="M4 20c1.5 0 3-.5 4-2 .85-1.27 2-4 2-4s.25 3.06 1 4c.5.66 1.5 2 3 2s3-.5 4-2V4"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h4c2 0 4 1.5 4 4s-2 4-4 4H6"/><path d="M6 12h2c2 0 4 1.5 4 4s-2 4-4 4H4"/><path d="M16 4h4"/><path d="M18 4v16"/><path d="M16 20h4"/></svg>'
  ];

  function getSubjectColor(name) {
    for (var i = 0; i < subjectsData.length; i++) { if (subjectsData[i].name === name) return subjectsData[i].color; }
    return '#0E8C8F';
  }
  function getSubjectIconIndex(name) {
    for (var i = 0; i < subjectsData.length; i++) { if (subjectsData[i].name === name) return subjectsData[i].icon_index; }
    return 0;
  }
  function getGradesForSubject(name) {
    var subj = null;
    for (var i = 0; i < subjectsData.length; i++) { if (subjectsData[i].name === name) { subj = subjectsData[i]; break; } }
    if (!subj) return [];
    var out = [];
    for (var i = 0; i < gradesData.length; i++) { if (gradesData[i].subject_id === subj.id) out.push(gradesData[i].grade); }
    return out;
  }
  function getGradeDisplay(g) {
    var m=g.match(/^(\d+)/);
    if(m) return m[1];
    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
  }

  var ARROW = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>';
  var CHEVRON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>';
  var YT_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg>';
  var PDF_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
  var PLAY_SM = '<svg width="20" height="20" viewBox="0 0 24 24" fill="white"><polygon points="9.5,7 9.5,17 17,12"/></svg>';

  var FOLDER_ICONS = [
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="12" y1="8" x2="12" y2="16"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
  ];

  function pickIcon(name) {
    var h=0;
    for(var i=0;i<name.length;i++) h=((h<<5)-h)+name.charCodeAt(i)|0;
    return FOLDER_ICONS[Math.abs(h)%FOLDER_ICONS.length];
  }

  var videos = [];
  var allFolders = [];

  function ytId(u){ if(!u) return null; var m=u.match(/(?:v=|youtu\.be\/|embed\/|\/v\/)([a-zA-Z0-9_-]{11})/); return m?m[1]:null; }
  function thumb(u,q){ var id=ytId(u); return id?'https://img.youtube.com/vi/'+id+'/'+(q||'hqdefault')+'.jpg':''; }
  function esc(s){ if(!s)return''; var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function getPdfUrls(v){
    if(Array.isArray(v.pdf_urls)&&v.pdf_urls.length) return v.pdf_urls.filter(function(u){ return u&&u.trim(); });
    if(v.pdf_url&&v.pdf_url.trim()) return [v.pdf_url];
    return [];
  }

  function hide() {
    $folders.style.display='none';
    $grid.style.display='none'; $empty.style.display='none';
    $bc.style.display='none'; $head.style.display='none';
  }

  function count(s,g) {
    var c=0;
    for(var i=0;i<videos.length;i++) { if(videos[i].subject===s && (!g||videos[i].grade===g)) c++; }
    return c;
  }

  function countFolder(s,g,fid) {
    var c=0;
    for(var i=0;i<videos.length;i++) { if(videos[i].subject===s && videos[i].grade===g && videos[i].folder_id===fid) c++; }
    return c;
  }

  function countNoFolder(s,g) {
    var c=0;
    for(var i=0;i<videos.length;i++) { if(videos[i].subject===s && videos[i].grade===g && !videos[i].folder_id) c++; }
    return c;
  }

  function showSubjects() {
    hide();
    var html='';
    for(var i=0;i<subjectsData.length;i++) {
      var n=subjectsData[i].name, col=subjectsData[i].color, ii=subjectsData[i].icon_index;
      html+='<button class="va-folder" data-nav="grades|'+esc(n)+'">'
        +'<div class="va-folder-icon" style="color:'+col+'">'+(SUBJECT_ICONS[ii]||SUBJECT_ICONS[0])+'</div>'
        +'<div class="va-folder-body"><div class="va-folder-title">'+n+'</div></div>'
        +'<div class="va-folder-arrow">'+ARROW+'</div></button>';
    }
    $folders.innerHTML=html;
    $folders.style.display='flex';
  }

  function showGrades(subj) {
    hide();
    var color=getSubjectColor(subj);
    var grades=getGradesForSubject(subj);
    $bc.innerHTML='<a href="#" class="va-bc-link" data-nav="subjects">Videoaulas</a>'
      +'<span class="va-bc-sep">'+CHEVRON+'</span>'
      +'<span class="va-bc-current">'+esc(subj)+'</span>';
    $bc.style.display='flex';
    $headT.textContent=subj;
    $headC.textContent=count(subj)+' aula'+(count(subj)!==1?'s':'');
    $head.style.display='flex';

    var html='';
    for(var i=0;i<grades.length;i++) {
      var g=grades[i], cnt=count(subj,g);
      var gd=getGradeDisplay(g);
      html+='<button class="va-folder" data-nav="folders|'+esc(subj)+'|'+esc(g)+'">'
        +'<div class="va-folder-grade" style="border-color:'+color+'">'+gd+'</div>'
        +'<div class="va-folder-body"><div class="va-folder-title">'+g+'</div>'
        +'<div class="va-folder-meta">'+cnt+' aula'+(cnt!==1?'s':'')+'</div></div>'
        +'<div class="va-folder-arrow">'+ARROW+'</div></button>';
    }
    $folders.innerHTML=html;
    $folders.style.display='flex';
  }

  function showFolders(subj, grade) {
    hide();
    $bc.innerHTML='<a href="#" class="va-bc-link" data-nav="subjects">Videoaulas</a>'
      +'<span class="va-bc-sep">'+CHEVRON+'</span>'
      +'<a href="#" class="va-bc-link" data-nav="grades|'+esc(subj)+'">'+esc(subj)+'</a>'
      +'<span class="va-bc-sep">'+CHEVRON+'</span>'
      +'<span class="va-bc-current">'+esc(grade)+'</span>';
    $bc.style.display='flex';
    $headT.textContent=grade+' · '+subj;
    var total=count(subj,grade);
    $headC.textContent=total+' aula'+(total!==1?'s':'');
    $head.style.display='flex';

    var folders=[];
    for(var i=0;i<allFolders.length;i++) {
      if(allFolders[i].subject===subj && allFolders[i].grade===grade) folders.push(allFolders[i]);
    }
    folders.sort(function(a,b){ return (a.order||0)-(b.order||0); });

    var noFolderCount=countNoFolder(subj,grade);
    var html='';

    for(var i=0;i<folders.length;i++) {
      var f=folders[i], cnt=countFolder(subj,grade,f.id);
      html+='<button class="va-folder" data-nav="videos|'+esc(subj)+'|'+esc(grade)+'|'+esc(f.id)+'">'
        +'<div class="va-folder-icon" style="color:var(--c-primary)">'
        +pickIcon(f.name)
        +'</div>'
        +'<div class="va-folder-body"><div class="va-folder-title">'+esc(f.name)+'</div>'
        +'<div class="va-folder-meta">'+cnt+' aula'+(cnt!==1?'s':'')+'</div></div>'
        +'<div class="va-folder-arrow">'+ARROW+'</div></button>';
    }

    if(noFolderCount>0) {
      html+='<button class="va-folder" data-nav="videos|'+esc(subj)+'|'+esc(grade)+'">'
        +'<div class="va-folder-icon" style="color:var(--c-text-3)">'
        +'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>'
        +'</div>'
        +'<div class="va-folder-body"><div class="va-folder-title">Outros</div>'
        +'<div class="va-folder-meta">'+noFolderCount+' aula'+(noFolderCount!==1?'s':'')+'</div></div>'
        +'<div class="va-folder-arrow">'+ARROW+'</div></button>';
    }

    if(!html) { $empty.style.display='flex'; return; }
    $folders.innerHTML=html;
    $folders.style.display='flex';
  }

  function showVideos(subj, grade, folderId) {
    hide();
    var folder = folderId ? allFolders.find(function(f){ return f.id===folderId; }) : null;
    var backTo = folderId ? 'folders' : 'grades';
    $bc.innerHTML='<a href="#" class="va-bc-link" data-nav="subjects">Videoaulas</a>'
      +'<span class="va-bc-sep">'+CHEVRON+'</span>'
      +'<a href="#" class="va-bc-link" data-nav="grades|'+esc(subj)+'">'+esc(subj)+'</a>'
      +'<span class="va-bc-sep">'+CHEVRON+'</span>'
      +'<a href="#" class="va-bc-link" data-nav="folders|'+esc(subj)+'|'+esc(grade)+'">'+esc(grade)+'</a>'
      +(folder ? '<span class="va-bc-sep">'+CHEVRON+'</span><span class="va-bc-current">'+esc(folder.name)+'</span>' : '');
    $bc.style.display='flex';
    $headT.textContent = folder ? folder.name+' · '+grade : grade+' · '+subj;

    var list=[];
    for(var i=0;i<videos.length;i++) {
      if(videos[i].subject===subj && videos[i].grade===grade) {
        if(folderId) { if(videos[i].folder_id===folderId) list.push(videos[i]); }
        else list.push(videos[i]);
      }
    }
    $headC.textContent=list.length+' aula'+(list.length!==1?'s':'');
    $head.style.display='flex';

    if(!list.length) { $empty.style.display='flex'; return; }

    /* Grid — all videos same size */
    var cards='';
    for(var k=0;k<list.length;k++) {
      var r=list[k], pdfs=getPdfUrls(r), pdfActions='';
      for(var pi=0;pi<pdfs.length;pi++){
        pdfActions+=(pi>0?'<span class="va-action-sep"></span>':'')+'<a href="'+esc(pdfs[pi])+'" target="_blank" rel="noopener" class="va-action-pdf">'+PDF_SVG+(pdfs.length>1?' PDF '+(pi+1):' PDF')+'</a>';
      }
      cards+='<div class="va-card">'
        +'<a href="'+esc(r.youtube_url)+'" target="_blank" rel="noopener" class="va-card-thumb">'
          +'<img src="'+thumb(r.youtube_url,'hqdefault')+'" alt="'+esc(r.title)+'" loading="lazy" onerror="this.onerror=null;this.src=\''+thumb(r.youtube_url,'sddefault')+'\'">'
          +'<div class="va-card-overlay"></div>'
          +'<div class="va-card-play"><div class="va-play-btn">'+PLAY_SM+'</div></div>'
          +(r.topic?'<span class="va-card-topic">'+esc(r.topic)+'</span>':'')
        +'</a>'
        +'<div class="va-card-body">'
          +'<h3 class="va-card-title">'+esc(r.title)+'</h3>'
          +(r.description?'<p class="va-card-desc">'+esc(r.description)+'</p>':'')
          +'<div class="va-card-actions">'
            +'<a href="'+esc(r.youtube_url)+'" target="_blank" rel="noopener" class="va-action-yt">'+YT_SVG+' YouTube</a>'
            +pdfActions
          +'</div>'
        +'</div>'
      +'</div>';
    }
    $grid.innerHTML=cards;
    $grid.style.display='grid';
  }

  document.addEventListener('click', function(e) {
    var btn=e.target.closest('[data-nav]');
    if(!btn) return;
    e.preventDefault();
    var p=btn.getAttribute('data-nav').split('|');
    if(p[0]==='subjects') showSubjects();
    else if(p[0]==='grades') showGrades(p[1]);
    else if(p[0]==='folders') showFolders(p[1],p[2]);
    else if(p[0]==='videos') showVideos(p[1],p[2],p[3]);
  });

  async function init() {
    try {
      var sRes=await db.from('subjects').select('*').order('display_order',{ascending:true});
      var gRes=await db.from('subject_grades').select('*').order('display_order',{ascending:true});
      subjectsData=sRes.data||[];
      gradesData=gRes.data||[];

      var res=await db.from('videos').select('*').order('order',{ascending:true});
      var fRes=await db.from('folders').select('*').order('order',{ascending:true});
      $loading.style.display='none';
      if(res.error) { $error.style.display='block'; $error.textContent='Erro ao carregar vídeos. Tenta novamente.'; return; }
      videos=(res.data||[]).filter(function(v){ return v.youtube_url && !v.draft; });
      allFolders=fRes.data||[];
      document.getElementById('totalCount').textContent=videos.length;
      document.getElementById('pdfCount').textContent=videos.reduce(function(n,v){ return n+getPdfUrls(v).length; },0);
      showSubjects();
    } catch(e) {
      $loading.style.display='none';
      $error.style.display='block';
      $error.textContent='Erro ao carregar. Verifica a tua ligação à internet.';
    }
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>

</body>
</html>
